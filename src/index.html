<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Easter Day Calculator</title>
        <link rel="stylesheet" href="styles/global.css" type="text/css">
        <link rel="stylesheet" href="styles/index.css" type="text/css">
    </head>
    <body>
        <div class="container">
            <div class="box center-text">
                <h1>Easter Day Calculator</h1>
            </div>
        </div>

        <div class="container">
            <div class="box">
                <form action="cgi-bin/easter_day.py" method="get">
                    <label for="year-input">Year:</label>
                    <input type="number" id="year-input" name="year" min="1" max="9999" required>
                    <br/>

                    <input type="radio" id="numerically" name="date_type" value="numerically">
                    <label for="numerically">Numerically</label>
                    <br/>
                    <input type="radio" id="verbosely" name="date_type" value="verbosely">
                    <label for="verbosely">Verbosely</label>
                    <br/>
                    <input type="radio" id="both" name="date_type" value="both" checked>
                    <label for="both">Both</label>
                    <br/>

                    <input type="submit" name="Submit Year" value="Submit Year">
                </form>
            </div>
        </div>
    </body>
</html>
